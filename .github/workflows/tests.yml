name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Without a checkout there are no scripts in the workspace to scan.
      - uses: actions/checkout@v6
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # tag=v2.0.0
        with:
          # style/info findings are advisory; fail the build on real defects only
          severity: warning
  pr-comment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test pr-comment.sh against a mock GitHub API
        run: node --test test/*.test.mjs
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@0d952c597ef8459f634d7145b0b044a9699e5e43 # tag=v1.71.0
  validate-action-yml:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - name: Validate action.yml
        run: |
          python3 -c "
          import yaml, sys
          try:
              with open('action.yml') as f:
                  action = yaml.safe_load(f)
              assert 'name' in action, 'Missing: name'
              assert 'description' in action, 'Missing: description'
              assert 'runs' in action, 'Missing: runs'
              assert 'steps' in action['runs'], 'Missing: runs.steps'
              print('action.yml is valid')
          except Exception as e:
              print(f'::error::{e}')
              sys.exit(1)
          "
  run-watcher-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.get-sha.outputs.commit_sha }}
    steps:
      - name: Checkout watcher-examples repo
        uses: actions/checkout@v6
        with:
          repository: dequelabs/watcher-examples
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: js/playwright/basic
        run: npm install
      - name: Install Playwright specific dependencies
        working-directory: js/playwright/basic
        run: npx playwright install chromium --with-deps
      # Since watcher-examples@149d134e the fixture launches `executablePath: $CHROME_BIN`,
      # and the runner image pre-sets that to branded Chrome, which ignores the
      # --load-extension flag axe Watcher needs. Upstream's own CI points CHROME_BIN at a
      # Chrome for Testing build; do the same with the one installed above.
      - name: Run Playwright tests with debug output
        working-directory: js/playwright/basic
        timeout-minutes: 2
        run: |
          set -euo pipefail
          CHROME_BIN="$(node -p "require('playwright').chromium.executablePath()")"
          export CHROME_BIN
          echo "CHROME_BIN=$CHROME_BIN"
          "$CHROME_BIN" --version
          # --exit: when the fixture's `before` hook fails, its `after` hook cannot close a
          # browser that never launched, and mocha waits on the orphan until it is killed.
          DEBUG="axe*" npm run test -- --exit
        env:
          API_KEY: ${{ secrets.API_AXE_WATCHER_IN_DEV_FOR_TESTS_YML }}
          PROJECT_ID: ${{ secrets.PROJECT_ID_AXE_WATCHER_IN_DEV_FOR_TESTS_YML }}
          SERVER_URL: 'https://axe.dequelabs.com'
      - name: Get commit SHA
        id: get-sha
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  run-devhub-action:
    needs: run-watcher-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Run axe DevHub action
        id: axe-devhub-action
        uses: ./
        continue-on-error: true
        with:
          project_id: ${{ secrets.PROJECT_ID_AXE_WATCHER_IN_DEV_FOR_TESTS_YML }}
          api_key: ${{ secrets.API_AXE_WATCHER_IN_DEV_FOR_TESTS_YML }}
          # providing the commit SHA from the watcher tests to ensure we're getting data for the same commit as tests were run against
          commit_sha: ${{ needs.run-watcher-tests.outputs.commit_sha }}
          server_url: 'https://axe.dequelabs.com'
          retry_count: '3'
      # If axe-devhub-action found violations (issue_count > 0), it should fail,
      # so we want to verify that failure is happening as expected and that we're getting the issue count output
      - name: Verify expected failure
        env:
          OUTCOME: ${{ steps.axe-devhub-action.outcome }}
          ISSUE_COUNT: ${{ steps.axe-devhub-action.outputs.issue_count }}
        run: |
          if [ "$OUTCOME" = "failure" ] && [ "$ISSUE_COUNT" -gt 0 ]; then
            echo "Action failed with $ISSUE_COUNT violations — expected behavior."
          else
            echo "::error::Unexpected outcome: $OUTCOME, issue_count: $ISSUE_COUNT"
            exit 1
          fi
      # The action found violations, so it must have left exactly one sticky
      # comment on this PR — and re-runs must update it rather than add another.
      # Fork PRs get a read-only token (and no secrets), so this cannot run there.
      - name: Verify the sticky comment is present exactly once
        if: ${{ github.event.pull_request.head.repo.fork == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Must stay byte-identical to MARKER in pr-comment.sh
          MARKER: '<!-- Sticky Pull Request Commentaxe-devhub -->'
        run: |
          set -euo pipefail
          count=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            | jq -s --arg marker "$MARKER" \
              '[ add[] | select(.body | contains($marker)) ] | length')
          echo "Found $count axe DevHub comment(s) on PR #$PR_NUMBER."
          if [ "$count" != "1" ]; then
            echo "::error::Expected exactly 1 axe DevHub sticky comment, found $count"
            exit 1
          fi
