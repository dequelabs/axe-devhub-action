name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Without a checkout there are no scripts in the workspace to scan.
      - uses: actions/checkout@v6
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # tag=v2.0.0
        with:
          # style/info findings are advisory; fail the build on real defects only
          severity: warning
  pr-comment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # 22.23.4 is the first 22.x that distrusts the compromised eMudhra CAs.
          # A bare `22` can reuse an older cached runner build; the range keeps that
          # floor, and check-latest picks up later 22.x security releases.
          node-version: '^22.23.4'
          check-latest: true
      - name: Print Node.js version
        run: node --version
      - name: Test pr-comment.sh against a mock GitHub API
        run: node --test test/*.test.mjs
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@0d952c597ef8459f634d7145b0b044a9699e5e43 # tag=v1.71.0
  validate-action-yml:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - name: Validate action.yml
        run: |
          python3 -c "
          import yaml, sys
          try:
              with open('action.yml') as f:
                  action = yaml.safe_load(f)
              assert 'name' in action, 'Missing: name'
              assert 'description' in action, 'Missing: description'
              assert 'runs' in action, 'Missing: runs'
              assert 'steps' in action['runs'], 'Missing: runs.steps'
              print('action.yml is valid')
          except Exception as e:
              print(f'::error::{e}')
              sys.exit(1)
          "
  scan-watcher-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.get-sha.outputs.commit_sha }}
    steps:
      # Scans ci/watcher-fixture/fixture.html, a page with deliberate violations, so the
      # action below always has some to report. The third-party login page this used
      # to scan (via watcher-examples) has had none since at least 2026-10-21.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # axe Watcher records the branch from `git rev-parse --abbrev-ref HEAD`, which is
      # just "HEAD" on the detached PR merge commit.
      - name: Name the branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: git switch --create "$HEAD_REF"
      # The dev test project only ingests runs from the repository it was created
      # for, and it was created for watcher-examples. Report that URL rather than
      # minting a new project and secrets.
      - name: Match the test project's repository
        run: git remote set-url origin https://github.com/dequelabs/watcher-examples
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Same ^22.23.4 floor as pr-comment-tests, for the eMudhra CA fix.
          node-version: '^22.23.4'
          check-latest: true
      - name: Print Node.js version
        run: node --version
      - name: Install dependencies
        working-directory: ci/watcher-fixture
        run: npm ci
      # The bundled Chrome for Testing build; branded Chrome ignores --load-extension.
      - name: Install Chromium
        working-directory: ci/watcher-fixture
        run: npx playwright install chromium --with-deps
      - name: Scan the fixture with axe Watcher
        working-directory: ci/watcher-fixture
        timeout-minutes: 2
        run: DEBUG="axe*" npm run scan
        env:
          API_KEY: ${{ secrets.API_AXE_WATCHER_IN_DEV_FOR_TESTS_YML }}
          PROJECT_ID: ${{ secrets.PROJECT_ID_AXE_WATCHER_IN_DEV_FOR_TESTS_YML }}
          SERVER_URL: 'https://axe.dequelabs.com'
      - name: Get commit SHA
        id: get-sha
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  run-devhub-action:
    needs: scan-watcher-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Run axe DevHub action
        id: axe-devhub-action
        uses: ./
        continue-on-error: true
        with:
          project_id: ${{ secrets.PROJECT_ID_AXE_WATCHER_IN_DEV_FOR_TESTS_YML }}
          api_key: ${{ secrets.API_AXE_WATCHER_IN_DEV_FOR_TESTS_YML }}
          # The commit the fixture scan reported, so the action reads that same run
          commit_sha: ${{ needs.scan-watcher-fixture.outputs.commit_sha }}
          server_url: 'https://axe.dequelabs.com'
          retry_count: '3'
      # If axe-devhub-action found violations (issue_count > 0), it should fail,
      # so we want to verify that failure is happening as expected and that we're getting the issue count output
      - name: Verify expected failure
        env:
          OUTCOME: ${{ steps.axe-devhub-action.outcome }}
          ISSUE_COUNT: ${{ steps.axe-devhub-action.outputs.issue_count }}
        run: |
          if [ "$OUTCOME" = "failure" ] && [ "$ISSUE_COUNT" -gt 0 ]; then
            echo "Action failed with $ISSUE_COUNT violations — expected behavior."
          else
            echo "::error::Unexpected outcome: $OUTCOME, issue_count: $ISSUE_COUNT"
            exit 1
          fi
      # The action found violations, so it must have left exactly one sticky
      # comment on this PR — and re-runs must update it rather than add another.
      # Fork PRs get a read-only token (and no secrets), so this cannot run there.
      - name: Verify the sticky comment is present exactly once
        if: ${{ github.event.pull_request.head.repo.fork == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Must stay byte-identical to MARKER in pr-comment.sh
          MARKER: '<!-- Sticky Pull Request Commentaxe-devhub -->'
        run: |
          set -euo pipefail
          count=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            | jq -s --arg marker "$MARKER" \
              '[ add[] | select(.body | contains($marker)) ] | length')
          echo "Found $count axe DevHub comment(s) on PR #$PR_NUMBER."
          if [ "$count" != "1" ]; then
            echo "::error::Expected exactly 1 axe DevHub sticky comment, found $count"
            exit 1
          fi
