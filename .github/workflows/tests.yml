name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Without a checkout there are no scripts in the workspace to scan.
      - uses: actions/checkout@v6
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # tag=v2.0.0
        with:
          # style/info findings are advisory; fail the build on real defects only
          severity: warning
  pr-comment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # 22.23.4 is the first 22.x that distrusts the compromised eMudhra CAs.
          # A bare `22` can reuse an older cached runner build; the range keeps that
          # floor, and check-latest picks up later 22.x security releases.
          node-version: '^22.23.4'
          check-latest: true
      - name: Print Node.js version
        run: node --version
      - name: Test pr-comment.sh against a mock GitHub API
        run: node --test test/*.test.mjs
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@0d952c597ef8459f634d7145b0b044a9699e5e43 # tag=v1.71.0
  validate-action-yml:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - name: Validate action.yml
        run: |
          python3 -c "
          import yaml, sys
          try:
              with open('action.yml') as f:
                  action = yaml.safe_load(f)
              assert 'name' in action, 'Missing: name'
              assert 'description' in action, 'Missing: description'
              assert 'runs' in action, 'Missing: runs'
              assert 'steps' in action['runs'], 'Missing: runs.steps'
              print('action.yml is valid')
          except Exception as e:
              print(f'::error::{e}')
              sys.exit(1)
          "
  run-watcher-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.get-sha.outputs.commit_sha }}
    steps:
      - name: Checkout watcher-examples repo
        uses: actions/checkout@v6
        with:
          repository: dequelabs/watcher-examples
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Same ^22.23.4 floor as pr-comment-tests, for the eMudhra CA fix.
          node-version: '^22.23.4'
          check-latest: true
      - name: Print Node.js version
        run: node --version
      - name: Install dependencies
        working-directory: js/playwright/basic
        run: npm install
      - name: Install Playwright specific dependencies
        working-directory: js/playwright/basic
        run: npx playwright install chromium --with-deps
      # Since watcher-examples@149d134e the fixture launches `executablePath: $CHROME_BIN`,
      # and the runner image pre-sets that to branded Chrome, which ignores the
      # --load-extension flag axe Watcher needs. Upstream's own CI points CHROME_BIN at a
      # Chrome for Testing build; do the same with the one installed above.
      - name: Run Playwright tests with debug output
        working-directory: js/playwright/basic
        timeout-minutes: 2
        run: |
          set -euo pipefail
          CHROME_BIN="$(node -p "require('playwright').chromium.executablePath()")"
          export CHROME_BIN
          echo "CHROME_BIN=$CHROME_BIN"
          "$CHROME_BIN" --version
          # --exit: when the fixture's `before` hook fails, its `after` hook cannot close a
          # browser that never launched, and mocha waits on the orphan until it is killed.
          DEBUG="axe*" npm run test -- --exit
        env:
          API_KEY: ${{ secrets.API_AXE_WATCHER_IN_DEV_FOR_TESTS_YML }}
          PROJECT_ID: ${{ secrets.PROJECT_ID_AXE_WATCHER_IN_DEV_FOR_TESTS_YML }}
          SERVER_URL: 'https://axe.dequelabs.com'
      - name: Get commit SHA
        id: get-sha
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  run-devhub-action:
    needs: run-watcher-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Run axe DevHub action
        id: axe-devhub-action
        uses: ./
        continue-on-error: true
        with:
          project_id: ${{ secrets.PROJECT_ID_AXE_WATCHER_IN_DEV_FOR_TESTS_YML }}
          api_key: ${{ secrets.API_AXE_WATCHER_IN_DEV_FOR_TESTS_YML }}
          # providing the commit SHA from the watcher tests to ensure we're getting data for the same commit as tests were run against
          commit_sha: ${{ needs.run-watcher-tests.outputs.commit_sha }}
          server_url: 'https://axe.dequelabs.com'
          retry_count: '3'
      # The watcher-examples scan reports no violations, so the action must pass
      # and still set its outputs.
      - name: Verify clean outcome
        env:
          OUTCOME: ${{ steps.axe-devhub-action.outcome }}
          ISSUE_COUNT: ${{ steps.axe-devhub-action.outputs.issue_count }}
          PROJECT_ID: ${{ steps.axe-devhub-action.outputs.project_id }}
          AXE_URL: ${{ steps.axe-devhub-action.outputs.axe_url }}
        run: |
          if [ "$OUTCOME" = "success" ] && [ "$ISSUE_COUNT" = "0" ] \
            && [ -n "$PROJECT_ID" ] && [ -n "$AXE_URL" ]; then
            echo "Action passed with 0 violations — expected behavior."
          else
            echo "::error::Unexpected outcome: $OUTCOME, issue_count: $ISSUE_COUNT, project_id: $PROJECT_ID, axe_url: $AXE_URL"
            exit 1
          fi
      # With no violations the action hides any earlier sticky comment, so none
      # may be left visible. Fork PRs get a read-only token, so this cannot run there.
      - name: Verify no sticky comment is left visible
        if: ${{ github.event.pull_request.head.repo.fork == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Must stay byte-identical to MARKER in pr-comment.sh
          MARKER: '<!-- Sticky Pull Request Commentaxe-devhub -->'
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # $owner etc. are GraphQL variables
          count=$(gh api graphql --paginate \
            -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F number="$PR_NUMBER" \
            -f query='query($owner: String!, $name: String!, $number: Int!, $endCursor: String) {
              repository(owner: $owner, name: $name) { pullRequest(number: $number) {
                comments(first: 100, after: $endCursor) {
                  nodes { body isMinimized }
                  pageInfo { hasNextPage endCursor }
                } } } }' \
            | jq -s --arg marker "$MARKER" '[ .[].data.repository.pullRequest.comments.nodes[]
                | select((.isMinimized | not) and (.body | contains($marker))) ] | length')
          echo "Found $count visible axe DevHub comment(s) on PR #$PR_NUMBER."
          if [ "$count" != "0" ]; then
            echo "::error::Expected no visible axe DevHub sticky comment, found $count"
            exit 1
          fi
