version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
    groups:
      # Any updates not caught by the group config will get individual PRs
      gha-low-risk:
        update-types:
          - "minor"
          - "patch"

  # The only npm manifest: the axe Watcher fixture scanned in CI (tests.yml).
  # Watcher updates are kept so CI exercises the release customers install.
  - package-ecosystem: "npm"
    directory: "/ci/watcher-fixture"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
    groups:
      # Any updates not caught by the group config will get individual PRs
      npm-low-risk:
        update-types:
          - "minor"
          - "patch"
